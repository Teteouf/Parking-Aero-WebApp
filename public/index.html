<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CDG Parking">
  <meta name="description" content="Retrouvez un parking, sa porte et les codes IATA, même hors connexion après une première ouverture.">
  <link rel="icon" href="assets/favicon-v2.ico" sizes="16x16 32x32 48x48" type="image/x-icon">
  <link rel="icon" href="assets/app-icon-v2-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="assets/app-icon-v2-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon-v2-152.png" sizes="152x152">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon-v2-167.png" sizes="167x167">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon-v2-180.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script defer src="js/mappings.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/preferences.js"></script>
  <script defer src="js/app.js"></script>
  <title>CDG Parking · Parking & portes</title>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="heading-row">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✈️</span><h1>CDG Parking</h1></div>
        <div class="header-actions">
        <button id="themeButton" class="icon-button theme-button" type="button" aria-label="Activer le mode nuit" title="Activer le mode nuit">
          <svg class="theme-icon-moon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
          <svg class="theme-icon-sun" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="shareButton" class="icon-button share-qr-button" type="button" aria-label="Partager l’application par QR code" title="Partager l’application">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.8"/>
            <rect x="3.5" y="3.5" width="3" height="3" fill="currentColor"/>
            <rect x="13" y="1" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.8"/>
            <rect x="15.5" y="3.5" width="3" height="3" fill="currentColor"/>
            <rect x="1" y="13" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.8"/>
            <rect x="3.5" y="15.5" width="3" height="3" fill="currentColor"/>
            <rect x="13" y="13" width="3" height="3" fill="currentColor"/>
            <rect x="18" y="13" width="3" height="3" fill="currentColor"/>
            <rect x="13" y="18" width="3" height="3" fill="currentColor"/>
            <rect x="18" y="18" width="3" height="3" fill="currentColor"/>
            <rect x="15.5" y="15.5" width="3" height="3" fill="currentColor"/>
          </svg>
        </button>
        </div>
      </div>
      <div class="search-box">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <label class="visually-hidden" for="searchInput">Rechercher un parking ou une porte</label>
        <input id="searchInput" type="search" placeholder="Parking ou porte · E22, K43…" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
        <button id="clearButton" class="clear-button" type="button" aria-label="Effacer la recherche" hidden>×</button>
      </div>
      <div class="tabs" role="tablist" aria-label="Type de recherche">
        <button id="parkingTab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="resultsPanel" data-mode="parking">Parkings & portes</button>
        <button id="iataTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="resultsPanel" tabindex="-1" data-mode="iata">Codes IATA</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="availability">
      <p id="offlineStatus" class="offline-status" role="status">Préparation de l’accès hors connexion…</p>
      <button id="updateButton" class="text-button" type="button" hidden>Nouvelle version · Actualiser</button>
    </div>
    <div id="quickAccess" class="quick-access">
      <section id="favoritesSection" aria-labelledby="favoritesTitle" class="quick-section" hidden>
        <div class="quick-heading"><h2 id="favoritesTitle">Favoris</h2><span id="preferencesScope">Sur cet appareil</span></div>
        <div id="favoritesList" class="shortcut-list"></div>
      </section>
      <section id="historySection" aria-labelledby="historyTitle" class="quick-section" hidden>
        <div class="quick-heading"><h2 id="historyTitle">Dernières recherches</h2><button id="clearHistoryButton" class="text-button" type="button">Effacer l’historique</button></div>
        <div id="historyList" class="shortcut-list"></div>
      </section>
    </div>
    <div id="parkingFilters" class="filters" aria-label="Filtrer les correspondances">
      <div class="primary-filters">
      <button class="filter active" type="button" data-filter="all" aria-pressed="true">Tous</button>
      <button class="filter" type="button" data-filter="2E" aria-pressed="false">2E</button>
      <button class="filter" type="button" data-filter="2F" aria-pressed="false">2F</button>
      <button class="filter" type="button" data-filter="2G" aria-pressed="false">2G</button>
      <button id="filterMoreButton" class="filter filter-more" type="button" aria-controls="additionalFilters" aria-expanded="false" aria-label="Afficher les autres filtres">Plus</button>
      </div>
      <div id="additionalFilters" class="additional-filters" hidden>
      <button class="filter" type="button" data-filter="1" aria-pressed="false">Terminal 1</button>
      <button class="filter" type="button" data-filter="access" aria-pressed="false">Rampe / ascenseur</button>
      </div>
    </div>
    <section id="resultsPanel" role="tabpanel" aria-labelledby="parkingTab">
      <div class="results-heading"><p id="resultsCount" aria-live="polite"></p><span id="searchHint">Parking ↔ porte</span></div>
      <div id="results" class="results"></div>
      <button id="showMoreButton" class="secondary-button more-button" type="button" hidden>Afficher plus de résultats</button>
    </section>
    <footer class="footer">
      <button id="dataInfoButton" class="text-button" type="button">À propos des données</button>
    </footer>
  </main>

  <dialog id="detailDialog" class="sheet" aria-labelledby="detailTitle">
    <div class="sheet-header"><h2 id="detailTitle">Détails de la correspondance</h2><button class="close-button" type="button" data-close aria-label="Fermer les détails">×</button></div>
    <div id="detailBody"></div>
  </dialog>
  <dialog id="infoDialog" class="sheet" aria-labelledby="infoTitle">
    <div class="sheet-header"><h2 id="infoTitle">L’application sur votre écran d’accueil</h2><button class="close-button" type="button" data-close aria-label="Fermer les informations">×</button></div>
    <div id="infoBody"></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="no-script">Activez JavaScript pour rechercher les parkings, portes et codes IATA.</p></noscript>
</body>
</html>
